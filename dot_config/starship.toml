add_newline = false

palette = "catppuccin_mocha"

format = """
$cmd_duration 󰜥 $directory $git_branch
$character"""

# ────────────────────────────
# Prompt Character (Triangle)
# ────────────────────────────
[character]
success_symbol = "[❯](fg:mauve)"
error_symbol = "[❯](fg:red)"

# ────────────────────────────
[package]
disabled = true

# ────────────────────────────
# Git Branch (minimal, colored text)
# ────────────────────────────
[git_branch]
symbol = "󰘬"
truncation_length = 30
style = "fg:blue"
format = "[$symbol $branch(:$remote_branch)]($style)"

# ────────────────────────────
[git_commit]
commit_hash_length = 4
tag_symbol = " "

[git_state]
format = '\($state( $progress_current of $progress_total)\) '
cherry_pick = "🍒 PICKING"

# ────────────────────────────
[git_status]
format = '([$all_status$ahead_behind]($style) )'
disabled = false
timeout = 10
conflicted = " 🏳 "
ahead = " 🏎💨 "
behind = " 😰 "
diverged = " 😵 "
untracked = " 🤷 "
stashed = " 📦 "
modified = " 📝 "
staged = '[++$count](fg:green)'
renamed = " ✍️ "
deleted = " 🗑 "

# ────────────────────────────
[hostname]
ssh_only = false
format = "•$hostname"
trim_at = ".companyname.com"
disabled = false

# ────────────────────────────
# Directory (minimal green accent)
# ────────────────────────────
[directory]
home_symbol = "  "
read_only = "  "
style = "fg:green"
truncation_length = 6
truncation_symbol = "••/"
format = '[󰉋 $path]($style)'

[directory.substitutions]
"Desktop" = "  "
"Documents" = "  "
"Downloads" = "  "
"Music" = " 󰎈 "
"Pictures" = "  "
"Videos" = "  "
"GitHub" = " 󰊤 "

# ────────────────────────────
# Command Duration
# ────────────────────────────
[cmd_duration]
min_time = 0
style = "fg:peach"
format = '[󰪢 $duration]($style)'

# ────────────────────────────
# Catppuccin Mocha Palette
# ────────────────────────────
[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"
